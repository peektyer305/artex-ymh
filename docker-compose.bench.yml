# ARTEX Tencent TSec Benchmark 評価用イメージ。ローカルでワンクリック build + run。
# 本番用の docker-compose.yml（マルチサービス：artex+postgres）とは互いに影響しない。
# 使い方：
#   cp bench/.env.example bench/.env   # LLM_API_KEY / BENCHMARK_TOKEN などを記入
#   docker compose -f docker-compose.bench.yml up --build      # ビルドしてフォアグラウンド実行（ログを確認）
#   docker compose -f docker-compose.bench.yml up --build -d   # バックグラウンド
#   docker compose -f docker-compose.bench.yml logs -f
#   docker compose -f docker-compose.bench.yml down            # 停止（-v を付けるとデータボリュームも削除）
# ブラウザ：http://localhost:8787（ADMIN_PASSWORD でログイン）

services:
  artex-bench:
    build:
      context: .
      dockerfile: Dockerfile.bench
    image: artex-bench:latest
    container_name: artex-bench
    env_file:
      - bench/.env
    # ホストとネットワークを共有：コンテナはホストのネットワークスタックを直接使い、ホスト／VPN 上の標的ネットワークへ直接接続できる。
    # host モードでは ports マッピングを使わず、コンテナがホストのポートを直接バインドする：8787（UI/API）、8788（プロキシ）、
    # さらに内部 PostgreSQL の 5432。ホスト側でこの 3 ポートが空いていることを確認してください（ローカル検証の前に占有しているサービスを停止する）。
    network_mode: host
    restart: "no"

volumes:
  artex_bench_data:
