name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write # Release 作成に必要

jobs:
  # ① Go 全量テストゲート：実際の PostgreSQL サービスを用意し、db/agent/server の PG テストを
  #    暗黙にスキップしない（ローカルで ARTEX_PG_DSN がない場合、これらのテストは依然 skip。db/testmain_test.go 参照）。
  #    注意：DSN を設定すると全 PG テストが実際に実行されます。CI 環境で個別ケースが既存の
  #    依存問題を露呈した場合は、このゲートを外すのではなくテスト自体を修正してください。
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U artex"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:artex@localhost:5432/artex?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - run: go vet ./...
      - run: go test ./...

  # ② フロントエンドの静的エクスポート（1 回）。成果物は各プラットフォームのクロスコンパイルで再利用し、tsc の型チェックもゲートに含める
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      # 型チェックは必須ゲート。biome はリポジトリ全体に既存の lint error が 100 件以上あるため、当面は src のみ
      # レポートし、ブロックはしない。既存分の整理後に必須ゲートへ格上げする。
      - run: npx tsc --noEmit
        working-directory: web
      - name: Biome lint report (src only, non-blocking)
        working-directory: web
        continue-on-error: true
        run: npx biome check src
      - run: npm run build:static
        working-directory: web
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/out

  # ③ 5 プラットフォームのクロスコンパイル（フロントエンド埋め込み）+ zip 作成
  binaries:
    needs: [test, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: server/webui/dist
      - name: Build and package with build.sh
        env:
          ARTEX_TARGET_OS: ${{ matrix.goos }}
          ARTEX_TARGET_ARCH: ${{ matrix.goarch }}
          ARTEX_BUILD_VERSION: ${{ github.ref_name }}
          ARTEX_SKIP_FRONTEND: "1"
          ARTEX_SKIP_NPM_CI: "1"
          # UPX の自己解凍 ELF は一部の Linux カーネル、仮想化、セキュリティポリシーでクラッシュします。
          # Release では Go リンカによる削減と zip 圧縮を使い、移植性を優先します。
          ARTEX_COMPRESS: "0"
          ARTEX_PACKAGE: "1"
          ARTEX_PACKAGE_DIR: dist
        run: |
          ./build.sh --target "${ARTEX_TARGET_OS}/${ARTEX_TARGET_ARCH}"
      - name: Smoke test Linux amd64 binary
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: dist/artex-linux-amd64/artex -h
      - uses: actions/upload-artifact@v4
        with:
          name: pkg-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "dist/*.zip"
      # Linux の生バイナリは個別にアップロードし、docker ジョブで再利用（イメージ内でのフロントエンド+Go の再ビルドを回避）
      - if: matrix.goos == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: bin-linux-${{ matrix.goarch }}
          path: dist/artex-linux-${{ matrix.goarch }}/artex

  # ④ すべての zip を集約 → チェックサム署名 → GitHub Release 作成
  release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: pkg-*
          merge-multiple: true
          path: dist
      - name: Generate checksums
        working-directory: dist
        run: sha256sum *.zip > SHA256SUMS
      - name: Sign checksums with minisign
        working-directory: dist
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
        run: |
          set -euo pipefail
          curl -fsSL -o minisign.tar.gz https://github.com/jedisct1/minisign/releases/download/0.12/minisign-0.12-linux.tar.gz
          echo "9a599b48ba6eb7b1e80f12f36b94ceca7c00b7a5173c95c3efc88d9822957e73  minisign.tar.gz" | sha256sum -c -
          tar xzf minisign.tar.gz
          printf '%s\n' "$MINISIGN_KEY" > minisign.key
          chmod 600 minisign.key
          ./minisign-linux/x86_64/minisign -S -s minisign.key -m SHA256SUMS
          shred -u minisign.key
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/SHA256SUMS
            dist/SHA256SUMS.minisig
          generate_release_notes: true

  # ⑤ マルチアーキテクチャイメージ → Docker Hub へ push（binaries でビルド済みの Linux バイナリを再利用。
  #    イメージにはツールのインストールとバイナリ配置のみ。arm64 は apt 層のエミュレーションだけで済み、ビルドが大幅に高速化）
  docker:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4 # Dockerfile と skills/ を取得
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-amd64
          path: dist/amd64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-arm64
          path: dist/arm64
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: autumn27/artex
          tags: |
            type=ref,event=tag
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
