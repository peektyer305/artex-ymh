name: check
on:
  pull_request:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artex
          POSTGRES_PASSWORD: artex
          POSTGRES_DB: artex
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U artex" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      ARTEX_PG_DSN: postgres://artex:artex@localhost:5432/artex?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build ./...
      - run: go vet ./config ./db ./agent ./server ./cmd/artex
      - run: go test ./config ./db ./agent ./server ./cmd/artex -run 'Test(DependencySetsStayIsolated|StableAndLegacyMentionKinds|MigrationFilenames|MigrationsFreshExistingAndRepeated|SecretCodecDomainsAndCompatibility|LoadErrorsAndMissing)'
