services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-artex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?.env に POSTGRES_PASSWORD を設定してください}
      POSTGRES_DB: ${POSTGRES_DB:-artex}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-artex} -d ${POSTGRES_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  artex:
    # ソースからカスタマイズ版イメージをビルド（Dockerfile (target: source) による自己完結ビルド：フロントエンド＋Go＋ツール層）。
    # 公式イメージ autumn27/artex は使わない。あれは上流のオリジナルで、カスタマイズコードを含まない。
    build:
      context: .
      dockerfile: Dockerfile
      target: source
    image: artex-ymh:local
    # ローカルの Dockerfile (target: source) から常にビルドする（レジストリから artex イメージを取得しない）
    pull_policy: build
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ARTEX_PG_DSN: postgres://${POSTGRES_USER:-artex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-artex}?sslmode=disable
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ARTEX_LLM_PROVIDER: ${ARTEX_LLM_PROVIDER:-}
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-}
      ARTEX_LLM_BASE_URL: ${ARTEX_LLM_BASE_URL:-}
      ARTEX_LLM_PROXY: ${ARTEX_LLM_PROXY:-}
    ports:
      - "8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      # データディレクトリ（jwt.key、SQLite など）をプロジェクトルートの data/ にバインドし、
      # ホスト側で直接確認／バックアップでき、コンテナ再作成でも失わない。
      - ./data:/app/data
      # プロジェクトルートの skills をコンテナへマウント（イメージ内蔵の /app/skills を上書き）。
      # skill の変更にイメージ再ビルドは不要で、コンテナはホスト側のこのファイルを読む。
      - ./skills:/app/skills
    restart: unless-stopped

volumes:
  pgdata:
